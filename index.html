<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reveal Math Grade 6 • Interactive Review • Andalus International Schools</title>
<style>
:root{--navy:#29277d;--blue:#2f8ec1;--red:#e96b7b;--gold:#f2b632;--ink:#25254d;--light:#f6f7fb;--green:#2e8b57;--danger:#c0394b}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#f7f8fc,#eef1f8);color:var(--ink)}
header{background:white;border-bottom:5px solid var(--navy);padding:14px 20px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.header-row{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
.logo{max-width:802px;width:100%;height:auto;display:block} .teacher{font-size:22px;font-weight:800;color:var(--navy);padding-left:18px;border-left:3px solid var(--gold)}
.container{max-width:1000px;margin:24px auto;padding:0 16px} .card{background:white;border-radius:20px;padding:25px;box-shadow:0 8px 30px rgba(41,39,125,.10);margin-bottom:20px}
h1{color:var(--navy);margin:5px 0 8px;font-size:30px} h2{color:var(--navy);font-size:24px;margin:0 0 8px} h3{margin:0 0 12px;color:var(--navy)}
.subtitle{font-size:16px;color:#666;margin-bottom:18px} .progress-wrap{background:#e7e8f1;height:13px;border-radius:20px;overflow:hidden;margin:15px 0}
.progress{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--navy));transition:width .3s} .topbar{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.badge{display:inline-block;padding:7px 12px;border-radius:30px;background:#eeeef9;color:var(--navy);font-weight:bold;font-size:14px} .score{font-weight:bold;color:var(--navy)}
.question-number{font-size:15px;color:#777;margin-bottom:7px} .question{font-size:30px;line-height:1.5;font-weight:800;margin:12px 0 24px;color:#29277d}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px} .choice{border:3px solid #dfe1ed;background:#fff;border-radius:18px;padding:19px;text-align:left;font-size:22px;font-weight:700;cursor:pointer;transition:.18s;box-shadow:0 5px 12px rgba(41,39,125,.08)}
.choice:hover{border-color:var(--blue);background:#f4fbff;transform:translateY(-3px)} .choice.correct{border-color:var(--green);background:#eaf8f0} .choice.wrong{border-color:var(--danger);background:#fff0f2}
.feedback{margin-top:17px;padding:15px;border-radius:14px;display:none;line-height:1.5} .feedback.show{display:block} .feedback.correct{background:#eaf8f0;border-left:6px solid var(--green)} .feedback.wrong{background:#fff0f2;border-left:6px solid var(--danger)}
.hint{margin-top:10px;background:#fff9e8;border-left:6px solid var(--gold);padding:13px;border-radius:10px;display:none} .hint.show{display:block}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:20px;flex-wrap:wrap} button{border:0;border-radius:12px;padding:12px 20px;font-size:16px;font-weight:bold;cursor:pointer}
.primary{background:var(--navy);color:white} .secondary{background:#e9eaf5;color:var(--navy)} button:disabled{opacity:.45;cursor:not-allowed}
.lesson-list{display:grid;grid-template-columns:1fr 1fr;gap:14px} .lesson-btn{background:#fff;border:2px solid #e1e2ee;border-radius:15px;padding:16px;text-align:left;cursor:pointer}
.lesson-btn:hover{border-color:var(--blue);transform:translateY(-2px)} .lesson-btn strong{display:block;color:var(--navy);font-size:17px;margin-bottom:4px} .lesson-btn small{color:#666}
.hidden{display:none!important} .result{text-align:center} .big-score{font-size:52px;font-weight:800;color:var(--navy);margin:10px}
.summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;text-align:left;margin-top:20px} .summary-item{padding:15px;border-radius:14px;background:#f5f6fb}
.points-pop{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);font-size:42px;font-weight:900;color:#f2a900;z-index:50;text-shadow:0 3px 0 #fff,0 6px 18px rgba(0,0,0,.18);animation:pointsPop 1.1s ease-out forwards;pointer-events:none}
@keyframes pointsPop{0%{opacity:0;transform:translate(-50%,20%) scale(.5)}20%{opacity:1;transform:translate(-50%,-30%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-180%) scale(1)}}
.sparkle{position:fixed;font-size:28px;z-index:49;pointer-events:none;animation:sparkleFly 1s ease-out forwards} @keyframes sparkleFly{0%{opacity:1;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3)}}
.encourage{font-size:21px;font-weight:800;margin-top:10px;color:var(--green)} .frac{display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1;min-width:28px;margin:0 3px} .frac>span:first-child{border-bottom:2px solid currentColor;padding:0 4px 2px} .frac>span:last-child{padding:2px 4px 0}
footer{text-align:center;color:#777;font-size:13px;padding:20px} 
@media(max-width:650px){.choices,.lesson-list,.summary{grid-template-columns:1fr}.question{font-size:25px}.choice{font-size:20px}h1{font-size:24px}.teacher{border-left:0;padding-left:0;font-size:18px}}
.choice:nth-child(1){border-color:#6c63ff;background:#f3f1ff} .choice:nth-child(2){border-color:#2f8ec1;background:#eef9ff} .choice:nth-child(3){border-color:#e96b7b;background:#fff1f4} .choice:nth-child(4){border-color:#f2b632;background:#fff9e8}
</style>
</head>

let quiz=[],current=0,score=0,lessonScores={},answered=false;
function buildHome(){const list=document.getElementById('lessonList');list.innerHTML='';lessons.forEach((l,i)=>{const b=document.createElement('button');b.className='lesson-btn';b.innerHTML=`<strong>Lesson ${l.id}: ${l.title}</strong><small>${l.pages} • 10 interactive questions</small>`;b.onclick=()=>startLesson(i);list.appendChild(b)})}
function startLesson(i){quiz=lessons[i].questions.map(q=>({...q,lesson:lessons[i]}));startQuiz()}
function startAll(){quiz=[];lessons.forEach(l=>l.questions.forEach(q=>quiz.push({...q,lesson:l})));startQuiz()}
function startQuiz(){current=0;score=0;lessonScores={};answered=false;document.getElementById('home').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');renderQuestion()}
function renderQuestion(){const q=quiz[current];answered=false;document.getElementById('lessonBadge').textContent=`Lesson ${q.lesson.id} • ${q.lesson.title}`;document.getElementById('scoreText').textContent=`⭐ Points: ${score*10}`;document.getElementById('questionNumber').textContent=`Question ${current+1} of ${quiz.length}`;document.getElementById('questionText').innerHTML=q.q;document.getElementById('progress').style.width=(current/quiz.length*100)+'%';const choices=document.getElementById('choices');choices.innerHTML='';q.choices.forEach((c,i)=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`<strong>${String.fromCharCode(65+i)}.</strong> ${c}`;b.onclick=()=>checkAnswer(i,b);choices.appendChild(b)});document.getElementById('feedback').className='feedback';document.getElementById('feedback').innerHTML='';document.getElementById('hint').className='hint';document.getElementById('hint').innerHTML='';document.getElementById('nextBtn').disabled=true}
function showReward(){const p=document.createElement('div');p.className='points-pop';p.textContent='+10 POINTS! ⭐';document.body.appendChild(p);setTimeout(()=>p.remove(),1100);const msgs=['Awesome! 🌟','Great job! 🎉','You got it! 🚀','Math Star! ⭐','Excellent thinking! 💪','Brilliant! 🧠✨','Keep shining! 🌈'];const fb=document.getElementById('feedback');const msg=document.createElement('div');msg.className='encourage';msg.textContent=msgs[Math.floor(Math.random()*msgs.length)];fb.appendChild(msg);for(let i=0;i<12;i++){const s=document.createElement('div');s.className='sparkle';s.textContent=['✨','⭐','🎉','💫'][Math.floor(Math.random()*4)];s.style.left=(50+(Math.random()*28-14))+'%';s.style.top=(35+(Math.random()*15-7.5))+'%';s.style.setProperty('--dx',(Math.random()*240-120)+'px');s.style.setProperty('--dy',(Math.random()*220-140)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}}
function checkAnswer(i,b){if(answered)return;const q=quiz[current];if(i===q.answer){answered=true;score++;lessonScores[q.lesson.id]=(lessonScores[q.lesson.id]||0)+1;b.classList.add('correct');document.querySelectorAll('.choice').forEach(x=>x.disabled=true);const fb=document.getElementById('feedback');fb.className='feedback show correct';fb.innerHTML='<strong>Correct! 🎉</strong> Great job. You understand the idea.';showReward();document.getElementById('scoreText').textContent=`⭐ Points: ${score*10}`;document.getElementById('nextBtn').disabled=false}else{b.classList.add('wrong');b.disabled=true;const fb=document.getElementById('feedback');fb.className='feedback show wrong';fb.innerHTML='<strong>Not quite — try again. 💡</strong>';const h=document.getElementById('hint');h.className='hint show';h.innerHTML='<strong>Helpful hint:</strong> '+q.hint}}
function nextQuestion(){if(!answered)return;current++;if(current<quiz.length)renderQuestion();else showResult()}
function showResult(){document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('progress').style.width='100%';document.getElementById('finalScore').textContent=`⭐ ${score*10} POINTS ⭐`;const pct=Math.round(score/quiz.length*100);document.getElementById('finalMessage').textContent=pct===100?'Excellent work! 🌟 You answered every question correctly.':pct>=80?'Great work! Keep practicing the questions you missed.':pct>=60?'Good effort! A little more practice will make these skills stronger.':'Keep going! Review the hints and try the practice again.';const s=document.getElementById('summary');s.innerHTML='';[...new Set(quiz.map(q=>q.lesson.id))].forEach(id=>{const l=lessons.find(x=>x.id===id),total=quiz.filter(q=>q.lesson.id===id).length,ok=lessonScores[id]||0;const d=document.createElement('div');d.className='summary-item';d.innerHTML=`<strong>Lesson ${id}</strong><br>${ok} / ${total} correct`;s.appendChild(d)})}
